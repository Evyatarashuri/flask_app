# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = migrations

# Use os.pathsep for cross-platform compatibility
version_path_separator = os

# Output encoding for generated migration files
output_encoding = utf-8

# Database connection string — use environment variable instead of hardcoding credentials
# Example for local development:
# export DATABASE_URL="postgresql://postgres:your_password@localhost/mydb"
sqlalchemy.url = ${DATABASE_URL}

[post_write_hooks]
# Example: format migration scripts automatically with Black or Ruff if desired
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
